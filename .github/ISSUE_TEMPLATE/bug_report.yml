name: 'Bug report'
description: 'Report a mistake, a contradiction or an outdated rule in a standard'
labels:
  - 'bug'
body:
  - type: 'checkboxes'
    id: 'before-posting'
    attributes:
      label: 'Before submitting:'
      options:
        - label: 'I have searched existing issues to make sure this is not a duplicate.'
          required: true
        - label: 'I agree to follow the [Code of Conduct](https://github.com/Linuxfabrik/standards/blob/main/CODE_OF_CONDUCT.md).'
          required: true

  - type: 'textarea'
    id: 'bug-description'
    attributes:
      label: 'What is wrong'
      description: 'Describe the mistake, the contradiction or what is outdated.'
    validations:
      required: true

  - type: 'input'
    id: 'location'
    attributes:
      label: 'Where'
      description: 'File and section, for example `CONTRIBUTING.md`, "Changelog".'
    validations:
      required: true

  - type: 'textarea'
    id: 'suggestion'
    attributes:
      label: 'Suggested wording'
      description: 'Optional: how the rule should read instead.'
